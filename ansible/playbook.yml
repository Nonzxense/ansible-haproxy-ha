---
- name: Deploy HA Cluster Infrastructure
  hosts: ha_cluster
  become: true
  vars_files:
    - vault.yml

  tasks:
    - name: Ensure configuration directories exist for both LBs
      ansible.builtin.file:
        path: "/opt/ha-cluster/{{ inventory_hostname }}"
        state: directory
        mode: '0755'

    - name: Create shared LB directory for Docker build context
      ansible.builtin.file:
        path: /opt/ha-cluster/lb
        state: directory
        mode: '0755'

    - name: Generate Keepalived configs from inventory variables
      ansible.builtin.template:
        src: templates/keepalived.conf.j2
        dest: "/opt/ha-cluster/{{ inventory_hostname }}/keepalived.conf"
        mode: '0644'

    - name: Copy Dockerfile, entrypoint, HAProxy config, and compose templates
      ansible.builtin.template:
        src: "{{ item.src }}"
        dest: "{{ item.dest }}"
        mode: "{{ item.mode | default('0644') }}"
      loop:
        - { src: 'templates/lb/Dockerfile', dest: '/opt/ha-cluster/lb/Dockerfile' }
        - { src: 'templates/lb/entrypoint.sh.j2', dest: '/opt/ha-cluster/lb/entrypoint.sh', mode: '0755' }
        - { src: 'templates/lb/haproxy.cfg.j2', dest: '/opt/ha-cluster/lb/haproxy.cfg' }
        - { src: 'templates/compose.yml.j2', dest: '/opt/ha-cluster/compose.yml' }
      run_once: true

    - name: Run Docker Compose
      community.docker.docker_compose_v2:
        project_src: /opt/ha-cluster
        state: present
        build: always
        recreate: always
      run_once: true
